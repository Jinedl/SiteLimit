name: Сборка APK

# main: тесты, сборка, обычный Release vX.Y (как раньше).
# feature/**: тесты и сборка; если versionName с суффиксом (0.10-beta1) — prerelease vX.Y-betaN.
# Prerelease не становится «latest», ссылка releases/latest ведёт на обычную версию.
on:
  push:
    branches: [main, "feature/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Версия
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            CH=release
          elif [[ "$V" == *-* ]]; then
            CH=prerelease
          else
            CH=none
            echo "::notice title=Без публикации::Ветка $GITHUB_REF_NAME, версия $V без суффикса (-betaN): APK собирается, но не публикуется."
          fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Версия: $V, ветка: $GITHUB_REF_NAME, публикация: $CH"

      - name: Ключ подписи
        id: key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning title=Нет подписи::Секрет SIGNING_PASSWORD не задан. APK соберётся без подписи и НЕ будет опубликован. См. README, раздел «Подпись»."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f signing/release.p12.enc ]; then
            echo "::warning title=Нет ключа::Нет файла signing/release.p12.enc. Запустите workflow «Создать ключ подписи (один раз)». APK НЕ будет опубликован."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/release.p12.enc -out "$RUNNER_TEMP/release.p12" -pass env:SIGNING_PASSWORD \
            || { echo "::error title=Ключ не расшифрован::Пароль в SIGNING_PASSWORD не совпадает с тем, с которым создавали ключ."; exit 1; }
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Тесты и сборка release-APK
        env:
          SIGNING_PASSWORD: ${{ steps.key.outputs.signed == 'true' && secrets.SIGNING_PASSWORD || '' }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Итог тестов
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          shown = 0
          for f in sorted(glob.glob('app/build/test-results/**/*.xml', recursive=True)):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  total += 1
                  bad = tc.findall('failure') + tc.findall('error')
                  if not bad:
                      continue
                  failed += 1
                  if shown < 10:
                      shown += 1
                      m = (bad[0].get('message') or bad[0].text or '').strip()
                      m = m.replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:900]
                      cls = tc.get('classname', '').split('.')[-1]
                      print(f"::error title=Тест {cls}.{tc.get('name')}::{m}")
          if total:
              print(f"::notice title=Тесты::{total - failed} из {total} прошли")
          EOF

      - name: Ошибки сборки — в аннотации
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E '^e: ' build.log | head -10 | while IFS= read -r l; do echo "::error title=Kotlin::$l"; done
          awk '/\* What went wrong:/{f=1;next} /\* Try:/{f=0} f' build.log | head -40 > wrong.txt
          if [ -s wrong.txt ]; then
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' wrong.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=What went wrong::$msg"
          fi

      - name: Проверка подписи
        if: steps.key.outputs.signed == 'true'
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Публикация в GitHub Release
        if: steps.key.outputs.signed == 'true' && steps.ver.outputs.channel != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          CH: ${{ steps.ver.outputs.channel }}
        run: |
          TAG="v$V"
          cp app/build/outputs/apk/release/app-release.apk "SiteLimit-$V.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Уже опубликовано::Release $TAG уже есть. Чтобы выпустить новую версию, увеличьте versionCode и versionName."
          elif [ "$CH" = "prerelease" ]; then
            gh release create "$TAG" "SiteLimit-$V.apk" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "SiteLimit $V (бета)" \
              --notes "Бета из ветки $GITHUB_REF_NAME, не для всех. APK для установки на телефон: нажмите на SiteLimit-$V.apk ниже."
            echo "::notice title=Опубликовано (prerelease)::https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          else
            gh release create "$TAG" "SiteLimit-$V.apk" \
              --target "$GITHUB_SHA" \
              --title "SiteLimit $V" \
              --notes "APK для установки на телефон: нажмите на SiteLimit-$V.apk ниже."
            echo "::notice title=Опубликовано::https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          fi

      - name: Удаление расшифрованного ключа
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
