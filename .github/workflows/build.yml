name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Версия
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

      - name: Ключ подписи
        id: key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning title=Нет подписи::Секрет SIGNING_PASSWORD не задан. APK соберётся без подписи и НЕ будет опубликован. См. README, раздел «Подпись»."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f signing/release.p12.enc ]; then
            echo "::warning title=Нет ключа::Нет файла signing/release.p12.enc. Запустите workflow «Создать ключ подписи (один раз)». APK НЕ будет опубликован."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/release.p12.enc -out "$RUNNER_TEMP/release.p12" -pass env:SIGNING_PASSWORD \
            || { echo "::error title=Ключ не расшифрован::Пароль в SIGNING_PASSWORD не совпадает с тем, с которым создавали ключ."; exit 1; }
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Сборка release-APK
        env:
          SIGNING_PASSWORD: ${{ steps.key.outputs.signed == 'true' && secrets.SIGNING_PASSWORD || '' }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Ошибки сборки — в аннотации
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E '^e: ' build.log | head -10 | while IFS= read -r l; do echo "::error title=Kotlin::$l"; done
          awk '/\* What went wrong:/{f=1;next} /\* Try:/{f=0} f' build.log | head -40 > wrong.txt
          if [ -s wrong.txt ]; then
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' wrong.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=What went wrong::$msg"
          fi

      - name: Проверка подписи
        if: steps.key.outputs.signed == 'true'
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Публикация в GitHub Release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$V"
          cp app/build/outputs/apk/release/app-release.apk "SiteLimit-$V.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Уже опубликовано::Release $TAG уже есть. Чтобы выпустить новую версию, увеличьте versionCode и versionName."
          else
            gh release create "$TAG" "SiteLimit-$V.apk" \
              --target "$GITHUB_SHA" \
              --title "SiteLimit $V" \
              --notes "APK для установки на телефон: нажмите на SiteLimit-$V.apk ниже."
            echo "::notice title=Опубликовано::https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          fi

      - name: Удаление расшифрованного ключа
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
